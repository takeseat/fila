name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  S3_BUCKET: takeseat-web-prod-20251220142021589500000003
  CLOUDFRONT_DISTRIBUTION_ID: E25O4T36RJ44KE
  # Production Safety Variables
  NODE_ENV: production
  DB_ENV: production
  RUN_SEEDS: "false"
  ALLOW_DESTRUCTIVE_DB: "false"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Disable cache to ensure clean install
          # cache: 'npm'
          # cache-dependency-path: |
          #   backend/package-lock.json
          #   frontend/package-lock.json
          #   frontend-admin/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          # Explicitly install React types to ensure they're available
          npm install --save-dev @types/react @types/react-dom
          npm run build

      - name: Build Backend
        working-directory: ./backend
        run: |
          # Clean to ensure Linux binaries
          rm -rf node_modules
          npm ci
          # Generate Prisma client BEFORE building TypeScript
          npx prisma generate
          npm run build

      - name: Package Backend for Lambda
        working-directory: ./backend
        run: |
          # Use optimized build script responsible for pruning dev deps and binaries
          chmod +x scripts/build-lambda.sh
          # IMPORTANT: Copy production env to .env so it gets packaged and loaded by migrate.ts
          cp .env.prod .env
          npm run package:lambda
          
          # Rename/Copy artifacts as expected by next steps
          mv lambda.zip lambda-api.zip
          cp lambda-api.zip lambda-migrate.zip

      - name: Upload Lambda Package to S3
        working-directory: ./backend
        run: |
          # Upload Lambda package to S3
          aws s3 cp lambda-api.zip s3://${{ env.S3_BUCKET }}/lambda/lambda-api.zip \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Backend API Lambda
        working-directory: ./backend
        run: |
          # Update Lambda function code from S3
          aws lambda update-function-code \
            --function-name takeseat-api-prod \
            --s3-bucket ${{ env.S3_BUCKET }} \
            --s3-key lambda/lambda-api.zip \
            --region ${{ env.AWS_REGION }}
          
          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name takeseat-api-prod \
            --region ${{ env.AWS_REGION }}

      - name: Run Production Guardrails
        working-directory: ./backend
        run: |
          echo "🛡️  Running Production Guardrails..."
          chmod +x scripts/guardrails-prod.sh
          ./scripts/guardrails-prod.sh
        env:
          NODE_ENV: production
          DB_ENV: production
          RUN_SEEDS: "false"
          ALLOW_DESTRUCTIVE_DB: "false"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Safe Database Migrations
        working-directory: ./backend
        run: |
          echo "🚀 Running Safe Prisma Migrations..."
          echo "ONLY 'prisma migrate deploy' will be executed"
          echo "❌ NO reset, push, or seed commands allowed"
          
          # Generate Prisma client
          npx prisma generate
          
          # Run ONLY migrate deploy (safe for production)
          npx prisma migrate deploy
          
          echo "✅ Migrations completed successfully"
        env:
          NODE_ENV: production
          DB_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy Frontend to S3
        working-directory: ./frontend
        run: |
          # Sync files to S3
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --region ${{ env.AWS_REGION }}
          
          # Upload index.html separately with no-cache
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate" \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront Cache
        run: |
          # Create invalidation
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --region ${{ env.AWS_REGION }}

      - name: Build Admin Portal
        working-directory: ./frontend-admin
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.takeseat.me
          VITE_APP_URL: https://takeseat.me

      - name: Deploy Admin Portal to S3
        working-directory: ./frontend-admin
        run: |
          # Note: Update ADMIN_S3_BUCKET and ADMIN_CLOUDFRONT_ID after running terraform apply
          # Get values from: terraform output admin_s3_bucket_name and admin_cloudfront_distribution_id
          
          # For now, skip if not configured
          if [ -z "$ADMIN_S3_BUCKET" ]; then
            echo "⚠️  Admin portal deployment skipped - ADMIN_S3_BUCKET not configured"
            echo "Run 'terraform apply' first, then update GitHub secrets with:"
            echo "  - ADMIN_S3_BUCKET (from terraform output admin_s3_bucket_name)"
            echo "  - ADMIN_CLOUDFRONT_ID (from terraform output admin_cloudfront_distribution_id)"
            exit 0
          fi
          
          # Sync files to S3
          aws s3 sync dist/ s3://$ADMIN_S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --region ${{ env.AWS_REGION }}
          
          # Upload index.html separately with no-cache
          aws s3 cp dist/index.html s3://$ADMIN_S3_BUCKET/index.html \
            --cache-control "public, max-age=0, must-revalidate" \
            --region ${{ env.AWS_REGION }}
          
          # Invalidate CloudFront cache
          if [ -n "$ADMIN_CLOUDFRONT_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $ADMIN_CLOUDFRONT_ID \
              --paths "/*" \
              --region ${{ env.AWS_REGION }}
          fi
        env:
          ADMIN_S3_BUCKET: ${{ secrets.ADMIN_S3_BUCKET }}
          ADMIN_CLOUDFRONT_ID: ${{ secrets.ADMIN_CLOUDFRONT_ID }}

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "🌐 Main Portal: https://takeseat.me"
          echo "🔐 Admin Portal: https://admin.takeseat.me"
          echo "🔌 API: https://api.takeseat.me"
          echo ""
          echo "📦 Lambda API: takeseat-api-prod"
          echo "🔄 Lambda Migrations: takeseat-migrate-prod"

